<!doctype html>
<!-- Manual/visual harness: runs the real DeployScene -> BattleScene flow with the 3D view.
     Serve the repo root and open /tests/harness/scenes.html?manual=1 -->
<html>
<head>
<meta charset="utf-8">
<base href="/">
<title>Scene flow harness</title>
<link rel="stylesheet" href="css/style.css">
<style>html,body{margin:0;height:100%;background:#000}#game-container{display:block !important;width:100vw;height:100vh}</style>
</head>
<body>
<div id="game-container"></div>
<script src="/lib/jszip.min.js"></script>
<script type="module">
import { SkinManager } from '/js/ui/skin-manager.js';
import { SceneManager } from '/js/tactical/scene-manager.js';
import { DeployScene } from '/js/tactical/deploy-scene.js';
import { BattleScene } from '/js/tactical/battle-scene.js';

const params = new URLSearchParams(location.search);
const sm = new SkinManager();
await sm.switchSkin('16x16_tiny_world');
const container = document.getElementById('game-container');
const scenes = new SceneManager(container, sm, () => { window.harness.exited = true; });
const manual = params.get('manual') === '1';
const deploy = new DeployScene('none', null, sm, scenes, (mapDef, spawns) => {
    scenes.replace(new BattleScene('none', null, null, { mapDef, customPlayerSpawns: spawns, manualControl: manual }));
});
scenes.push(deploy);
window.harness = { scenes, deploy, sm, exited: false, frames: 0 };
const count = () => { window.harness.frames++; requestAnimationFrame(count); };
requestAnimationFrame(count);
</script>
</body>
</html>
